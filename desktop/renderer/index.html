  <meta charset="UTF-8" />
  <script>
    // Apply the persisted theme/locale before first paint.
    //
    // The stylesheet's `:root` defaults are the dark palette, so without this
    // the pre-painted splash (and the whole shell) paints dark for the first
    // frames and then flips once the bundle runs. Only an explicit dark choice
    // paints dark; anything else (`light`, `system`, or nothing stored) paints
    // light — the main process pins `nativeTheme.themeSource` to light, so
    // "system" resolves light too.
    try {
      var t = localStorage.getItem("encre-theme");
      document.documentElement.setAttribute("data-theme", t === "dark" ? "dark" : "light");
    } catch (e) {}
    // Colour skin (水墨/山樱/…): the palettes live in themes/<skin>.css and
    // ride on [data-skin]. Markup defaults to ink; only a stored, known skin
    // overrides it before first paint. This list must stay in sync with
    // src/core/state.ts THEME_SKINS (main.ts and tray-popup.html derive
    // theirs from themes/*.css directly).
    try {
      var skin = localStorage.getItem("encre-theme-skin");
      if (["ink","spring","autumn","winter","honey","grass","sky","sunset"].indexOf(skin) >= 0) {
        document.documentElement.setAttribute("data-skin", skin);
      }
    } catch (e) {}
    // Same reasoning for locale/direction: an ar/he session must not flash a
    // left-to-right layout (or wrong font stack) for a frame. setLocale() in
    // i18n.ts keeps it in sync later.
    try {
      var l = localStorage.getItem("encre-locale");
      if (l === "ar" || l === "he") {
        document.documentElement.dir = "rtl";
        document.documentElement.lang = l;
      } else if (l) {
        document.documentElement.lang = l === "zh-Hant" ? "zh-TW" : l;
      }
      if (l) document.documentElement.setAttribute("data-locale", l);
    } catch (e) {}
  </script>

       (idempotent markers). Without it the 2.3MB bundle and its chunk graph

       the body), which serialized the entire cold-start critical path.
       Preloading here overlaps the bundle's disk reads / AV scans with the
       CSS and lucide work instead of queueing behind them. -->
  <!--modulepreload:start-->
  <link rel="modulepreload" href="bundle.js" />
  <link rel="modulepreload" href="chunks/chunk-BGEGSM47.js" />

  <script>
    // Window controls must work during the splash/boot phase, BEFORE the main
    // app bundle loads (slow cold starts can delay it by seconds). Bound here
    // at parse time; app.ts intentionally does NOT re-bind these.
    (function () {
      var api = window.electronAPI;
      var bind = function (id, fn) {
        var el = document.getElementById(id);
        if (el) el.addEventListener("click", fn);
      };
      bind("btn-minimize", function () { if (api) api.windowMinimize(); });
      bind("btn-maximize", function () { if (api) api.windowMaximize(); });
      bind("btn-close", function () { if (api) api.windowClose(); });
      // Maximize/restore icon follows the window's real state (Windows
      // convention): initial sync + live updates pushed from main process.
      var btnMax = document.getElementById("btn-maximize");
      var setMaxState = function (m) {
        if (btnMax) btnMax.classList.toggle("maximized", !!m);
      };
      if (api && btnMax) {
        api.windowIsMaximized().then(setMaxState).catch(function () {});
        if (api.onWindowMaximizeChange) api.onWindowMaximizeChange(setMaxState);
      }
    })();
  </script>

                        <!-- Resource sub-pages, filled in by app.ts on open -->
                        <div class="mention-page hidden" data-page="res-agents"></div>
                        <div class="mention-page hidden" data-page="res-skills"></div>
                        <div class="mention-page hidden" data-page="res-connectors"></div>
                        <div class="mention-page hidden" data-page="res-rules"></div>
                        <div class="mention-page hidden" data-page="res-library"></div>
                        <div class="mention-page hidden" data-page="res-attach"></div>
                      </div>
                    </div>
                    <button type="button" id="btn-input-expand" class="btn-icon input-btn btn-hidden" data-i18n-title="input.expand" aria-label="Expand input">
                      <i data-lucide="maximize-2" class="lucide expand-icon"></i>
                      <i data-lucide="minimize-2" class="lucide collapse-icon" style="display:none"></i>
                    </button>
                  </div>
                  <div id="toolbar-mode-chip" class="toolbar-mode-chip hidden" data-mode="">
                    <i data-lucide="list-checks" class="chip-icon" style="width:12px;height:12px;"></i>
                    <span class="toolbar-mode-label"></span>
                  </div>
                  <div id="toolbar-command-chip" class="toolbar-command-chip hidden" data-command="">
                    <i data-lucide="wand-2" class="chip-icon" style="width:12px;height:12px;"></i>
                    <span class="toolbar-command-label"></span>
                  </div>
                </div>
                <div class="toolbar-right">
                  <div class="settings-dropdown-wrap" id="input-model-selector-wrap">
                    <button id="input-model-selector" class="input-selector" data-i18n-title="input.selectModel" title="Select model">
                      <span class="input-selector-label"></span>
                      <i data-lucide="chevron-down" class="lucide input-selector-chevron"></i>
                    </button>
                    <div id="input-model-dropdown" class="mention-dropdown hidden"></div>
                  </div>
                  <button class="btn-send" id="btn-send" data-i18n-title="input.send" title="Send">
                    <i data-lucide="arrow-up" class="lucide"></i>
                  </button>
                  <button class="btn-stop" id="btn-stop" data-i18n-title="input.stop" title="Stop" style="display:none;">
                    <i data-lucide="circle" class="lucide"></i>
                  </button>
                </div>
              </div>
            </div>
            <div id="input-disclaimer" class="input-disclaimer" data-i18n="input.disclaimer">AI-generated content is for reference only</div>
            </div><!-- /main-content-clip -->
          <!-- Summary floating panel -->
          <div id="summary-panel" class="summary-panel hidden">
            <div class="summary-panel-body">
              <div class="summary-panel-section" id="summary-context">
                <div class="summary-panel-header" id="summary-context-header">
                  <span class="summary-panel-title" data-i18n="summary.context">Context</span>
                  <span class="summary-ctx-usage" id="summary-context-usage"></span>
                </div>
                <div class="summary-panel-items" id="summary-context-items"></div>
              </div>
              <div class="summary-panel-section" id="summary-progress">
                <div class="summary-panel-header">
                  <span class="summary-panel-title" data-i18n="summary.progress">Progress</span>
                </div>
                <div class="summary-panel-items" id="summary-progress-items"></div>
              </div>
              <div class="summary-panel-section" id="summary-artifacts">
                <div class="summary-panel-header">
                  <span class="summary-panel-title" data-i18n="summary.artifacts">Artifacts</span>
                  <a class="summary-panel-link" id="summary-view-all" href="#" data-i18n="summary.viewAll">View all</a>
                </div>
                <div class="summary-panel-items" id="summary-artifacts-items"></div>
              </div>
              <div class="summary-panel-section" id="summary-references">
                <div class="summary-panel-header">
                  <span class="summary-panel-title" data-i18n="summary.references">References</span>
                </div>
                <div class="summary-panel-items" id="summary-references-items"></div>
              </div>
            </div>
          </div>
          </div>
        </div>
        <!-- Search overlay (global, outside main-content) -->
<div id="review-commit-overlay" class="hidden">
  <div class="search-palette">
    <div class="search-overlay-inner">
      <i data-lucide="git-commit-horizontal" class="lucide search-overlay-icon"></i>
      <input type="text" id="review-commit-input" class="palette-input" placeholder="Commit message" autocomplete="off" spellcheck="false" />
      <kbd class="search-esc-hint">ESC</kbd>
    </div>
  </div>
</div>
<div id="search-overlay" class="hidden">
          <div class="search-palette">
            <div class="search-overlay-inner">
              <i data-lucide="search" class="lucide search-overlay-icon"></i>
              <input type="text" id="search-input" data-i18n-placeholder="search.placeholder" placeholder="Search messages, files..." autocomplete="off" spellcheck="false" />
              <kbd class="search-esc-hint">ESC</kbd>
            </div>
            <div id="search-results" class="search-results"></div>
          </div>
        </div>
        <!-- Automation view -->
          <div id="automation-view" class="hidden">
            <div class="automation-tabs">
              <button class="automation-tab" data-automation-tab="configured" data-i18n="automation.configured">已配置</button>
              <button class="automation-tab active" data-automation-tab="history" data-i18n="automation.history">执行历史</button>
              <div class="automation-create-wrap" id="automation-create-wrap">
                <button class="btn-add-model-top" id="automation-create-btn" type="button">
                  <i data-lucide="plus" class="lucide"></i>
                  <span data-i18n="automation.create">创建</span>
                  <i data-lucide="chevron-down" class="lucide"></i>
                </button>
                <div class="settings-dropdown" id="automation-create-dropdown"></div>
              </div>
            </div>
            <div class="automation-container">
              <div class="automation-panels">
                <div class="automation-panel" data-automation-panel="configured">
                  <div class="configured-list" id="configured-list"></div>
                </div>
                <div class="automation-panel active" data-automation-panel="history">
                  <div class="history-filters" id="history-filters">
                    <div class="history-filter-dropdown settings-dropdown-wrap" id="history-filter-status-wrap">
                      <button class="history-filter-btn" id="history-filter-status-trigger" type="button">
                        <span id="history-filter-status-label" data-i18n="automation.filterAll">全部</span>
                        <i data-lucide="chevron-down" class="lucide settings-dropdown-chevron"></i>
                      </button>
                      <div class="settings-dropdown" id="history-filter-status-dropdown"></div>
                    </div>
                    <div class="history-filter-dropdown settings-dropdown-wrap" id="history-filter-task-wrap">
                      <button class="history-filter-btn" id="history-filter-task-trigger" type="button">
                        <span id="history-filter-task-label" data-i18n="automation.filterAllTasks">全部任务</span>
                        <i data-lucide="chevron-down" class="lucide settings-dropdown-chevron"></i>
                      </button>
                      <div class="settings-dropdown" id="history-filter-task-dropdown"></div>
                    </div>
                    <div class="history-date-range">
                      <div class="history-date-field" id="history-date-from-wrap">
                        <button type="button" class="history-date-btn" id="history-date-from-btn">
                          <span id="history-date-from-text">开始日期</span>
                          <svg class="lucide" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
                        </button>
                        <div class="settings-dropdown history-calendar-dropdown" id="history-date-from-dd"></div>
                        <input type="hidden" id="history-date-from" value="" />
                      </div>
                      <span class="history-date-sep">—</span>
                      <div class="history-date-field" id="history-date-to-wrap">
                        <button type="button" class="history-date-btn" id="history-date-to-btn">
                          <span id="history-date-to-text">结束日期</span>
                          <svg class="lucide" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
                        </button>
                        <div class="settings-dropdown history-calendar-dropdown" id="history-date-to-dd"></div>
                        <input type="hidden" id="history-date-to" value="" />
                      </div>
                      <button type="button" class="history-date-clear" id="history-date-clear" title="清空时间">
                        <i data-lucide="x" class="lucide"></i>
                      </button>
                    </div>
                  </div>
                  <div class="history-timeline" id="history-timeline"></div>
                </div>
              </div>
            </div>
              <!-- Automation detail: renders sub-agent result using chat's renderSubAgentInto -->
              <div class="automation-detail hidden">
                <div class="automation-detail-bar">
                  <div class="automation-detail-breadcrumb" id="automation-detail-breadcrumb"></div>
                </div>
                <div class="automation-detail-scroll" id="automation-detail-scroll">
                  <div class="automation-detail-content chat-view" id="automation-detail-content"></div>
                </div>
              </div>
          </div>
          <!-- /Automation view -->

          <!-- Plugin market view (covers the whole #main-body exactly like
               #automation-view; rendered by features/market.ts) -->
          <div id="market-view" class="hidden"></div>

          <!-- Session inner sidebar -->
        <div id="session-inner-sidebar" class="hidden">
          <div class="si-resize-handle"></div>
          <div class="tab-bar"></div>
          <div class="tab-body"></div>
        </div>
      </div>
    </main>

    <!-- Tool details panel -->
    <aside id="detail-panel" class="hidden">
      <div id="detail-content"></div>
    </aside>
  </div>

  <!-- Session context menu (dynamically rendered) -->
  <div id="session-context-menu" class="hidden context-menu"></div>

  <!-- Workspace manager context menu (dynamically rendered) -->
  <div id="workspace-mgr-context-menu" class="hidden context-menu"></div>

  <!-- In-app splash / loading screen: covers boot while the startup mode's
       data is filled, fades out on reveal, shown again for connection errors.
       The window is revealed by the main process on `ready-to-show`, which is
       the first paint of THIS document — seconds before bundle.js runs. So the
       splash has to be complete in markup: `body.splash-mode` above is what
       keeps the app chrome out of that first frame, and the still logo below is
       what replaces the loader SplashScreen.show() only mounts once JS runs.
       SplashScreen.show() removes it when it takes the loader over. -->
  <div id="splash-screen">
    <div class="ea-loader ea-loader--static splash-preload">
      <img class="splash-preload-dark" src="assets/Encre-dm.svg" alt="" />
      <img class="splash-preload-light" src="assets/Encre-lm.svg" alt="" />
    </div>
  </div>

  </div><!-- /app-shell -->

  <!-- ESM entry: bundle.js is loaded with type="module" so esbuild code
       splitting can lazy-load heavy on-demand chunks (xlsx, xterm, chart.js…). -->
  <script type="module" src="bundle.js"></script>
  <script>lucide.createIcons();</script>

</body>
