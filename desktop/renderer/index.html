  <script>
    // Apply the persisted UI locale/direction before first paint so an
    // ar/he session does not flash a left-to-right layout (or wrong font
    // stack) for a frame. setLocale() in i18n.ts keeps it in sync later.
    try {
      var l = localStorage.getItem("encre-locale");
      if (l === "ar" || l === "he") {
        document.documentElement.dir = "rtl";
        document.documentElement.lang = l;
      } else if (l) {
        document.documentElement.lang = l === "zh-Hant" ? "zh-TW" : l;
      }
      if (l) document.documentElement.setAttribute("data-locale", l);
    } catch (e) {}
  </script>

  <script>
    // Window controls must work during the splash/boot phase, BEFORE the main
    // app bundle loads (slow cold starts can delay it by seconds). Bound here
    // at parse time; app.ts intentionally does NOT re-bind these.
    (function () {
      var api = window.electronAPI;
      var bind = function (id, fn) {
        var el = document.getElementById(id);
        if (el) el.addEventListener("click", fn);
      };
      bind("btn-minimize", function () { if (api) api.windowMinimize(); });
      bind("btn-maximize", function () { if (api) api.windowMaximize(); });
      bind("btn-close", function () { if (api) api.windowClose(); });
      // Maximize/restore icon follows the window's real state (Windows
      // convention): initial sync + live updates pushed from main process.
      var btnMax = document.getElementById("btn-maximize");
      var setMaxState = function (m) {
        if (btnMax) btnMax.classList.toggle("maximized", !!m);
      };
      if (api && btnMax) {
        api.windowIsMaximized().then(setMaxState).catch(function () {});
        if (api.onWindowMaximizeChange) api.onWindowMaximizeChange(setMaxState);
      }
    })();
  </script>

                </div>
                <div class="automation-panel active" data-automation-panel="history">
                  <div class="history-filters" id="history-filters">
                    <div class="history-filter-dropdown settings-dropdown-wrap" id="history-filter-status-wrap">
                      <button class="history-filter-btn" id="history-filter-status-trigger" type="button">
                        <span id="history-filter-status-label" data-i18n="automation.filterAll">全部</span>
                        <i data-lucide="chevron-down" class="lucide settings-dropdown-chevron"></i>
                      </button>
                      <div class="settings-dropdown" id="history-filter-status-dropdown"></div>
                    </div>
                    <div class="history-filter-dropdown settings-dropdown-wrap" id="history-filter-task-wrap">
                      <button class="history-filter-btn" id="history-filter-task-trigger" type="button">
                        <span id="history-filter-task-label" data-i18n="automation.filterAllTasks">全部任务</span>
                        <i data-lucide="chevron-down" class="lucide settings-dropdown-chevron"></i>
                      </button>
                      <div class="settings-dropdown" id="history-filter-task-dropdown"></div>
                    </div>
                    <div class="history-date-range">
                      <div class="history-date-field" id="history-date-from-wrap">
                        <button type="button" class="history-date-btn" id="history-date-from-btn">
                          <span id="history-date-from-text">开始日期</span>
                          <svg class="lucide" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
                        </button>
                        <div class="settings-dropdown history-calendar-dropdown" id="history-date-from-dd"></div>
                        <input type="hidden" id="history-date-from" value="" />
                      </div>
                      <span class="history-date-sep">—</span>
                      <div class="history-date-field" id="history-date-to-wrap">
                        <button type="button" class="history-date-btn" id="history-date-to-btn">
                          <span id="history-date-to-text">结束日期</span>
                          <svg class="lucide" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
                        </button>
                        <div class="settings-dropdown history-calendar-dropdown" id="history-date-to-dd"></div>
                        <input type="hidden" id="history-date-to" value="" />
                      </div>
                      <button type="button" class="history-date-clear" id="history-date-clear" title="清空时间">
                        <i data-lucide="x" class="lucide"></i>
                      </button>
                    </div>
                  </div>
                  <div class="history-timeline" id="history-timeline"></div>
                </div>
              </div>
            </div>
              <!-- Automation detail: renders sub-agent result using chat's renderSubAgentInto -->
              <div class="automation-detail hidden">
                <div class="automation-detail-bar">
                  <div class="automation-detail-breadcrumb" id="automation-detail-breadcrumb"></div>
                </div>
                <div class="automation-detail-scroll" id="automation-detail-scroll">
                  <div class="automation-detail-content chat-view" id="automation-detail-content"></div>
                </div>
              </div>
          </div>
          <!-- /Automation view -->

          <!-- Session inner sidebar -->
        <div id="session-inner-sidebar" class="hidden">
          <div class="si-resize-handle"></div>
          <div class="tab-bar"></div>
          <div class="tab-body"></div>
        </div>
      </div>
    </main>

    <!-- Tool details panel -->
    <aside id="detail-panel" class="hidden">
      <div id="detail-content"></div>
    </aside>
  </div>

  <!-- Session context menu (dynamically rendered) -->
  <div id="session-context-menu" class="hidden context-menu"></div>

  <!-- Workspace manager context menu (dynamically rendered) -->
  <div id="workspace-mgr-context-menu" class="hidden context-menu"></div>

  <!-- In-app splash / loading screen: covers boot while the startup mode's
       data is filled, fades out on reveal, shown again for connection errors. -->
  <div id="splash-screen"></div>

  </div><!-- /app-shell -->

  <!-- ESM entry: bundle.js is loaded with type="module" so esbuild code
       splitting can lazy-load heavy on-demand chunks (xlsx, xterm, chart.js…). -->
  <script type="module" src="bundle.js"></script>
  <script>lucide.createIcons();</script>

</body>
</html>
