<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
/* ── Theme tokens (light default) ── */
:root,[data-theme="light"]{
  --tp-bg:#ffffff;--tp-color:#1f1f1f;--tp-hover:#f5f5f5;--tp-border:#f0f0f0;
  --tp-line:#e8e8e8;--tp-scrollbar:#ddd;--tp-sub-color:#999;
  --tp-name:#1f1f1f;--tp-meta:#888;--tp-empty:#bbb;--tp-badge-bg:#eef2ff;
  --tp-badge-color:#4f46e5;  --tp-dot:#ccc;--tp-sep:#f0f0f0;--tp-bg-tertiary:#f0f0f0;--tp-accent:#666;--tp-active:rgba(0,0,0,0.06);
  color-scheme:light;
  /* Map tray palette to the shared .seg component variables
     (defined in _components.css). Both surfaces now resolve through
     the same CSS component, ensuring identical UI + animations. */
  --seg-bg:#eeeeee;--seg-active-bg:#ffffff;--seg-text:#666;--seg-text-hover:#1f1f1f;--seg-active-text:#1f1f1f;
  /* Unified motion tokens (mirror design-system.css) so the tray shares the
     exact same durations/easings as the main window. */
  --duration-fast:0.12s;--duration-base:0.18s;--duration-slow:0.28s;
  --easing-standard:cubic-bezier(0.4,0,0.2,1);--easing-emphasized:cubic-bezier(0.16,1,0.3,1);
  --transition-fast:var(--duration-fast) var(--easing-standard);
  --transition-base:var(--duration-base) var(--easing-standard);
  --transition-emphasized:var(--duration-slow) var(--easing-emphasized);
  --motion-slide:var(--duration-slow) var(--easing-standard);
}
[data-theme="dark"]{
  --tp-bg:#1a1a1a;--tp-color:#e5e5e5;--tp-hover:#262626;--tp-border:#333333;
  --tp-line:#333333;--tp-scrollbar:#444;--tp-sub-color:#777;
  --tp-name:#e5e5e5;--tp-meta:#888;--tp-empty:#666;--tp-badge-bg:#1e1b4b;
  --tp-badge-color:#a5b4fc;  --tp-dot:#555;--tp-sep:#2a2a2a;--tp-bg-tertiary:#2a2a2a;--tp-accent:#999;--tp-active:rgba(255,255,255,0.08);
  color-scheme:dark;
  --seg-bg:#2a2a2a;--seg-active-bg:#3a3a3a;--seg-text:#999;--seg-text-hover:#f5f5f5;--seg-active-text:#f5f5f5;
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;background:var(--tp-bg);color:var(--tp-color);overflow:hidden;-webkit-font-smoothing:antialiased;user-select:none;font-size:13px;display:flex;flex-direction:column}
#sessions-container{flex:1;overflow-y:auto;overflow-x:hidden;position:relative}
/* ── Mode-switch slide (unified with the main window's motion system) ──
   A mode switch slides the whole session list in as a full-width push:
   entering Work arrives from the inline-end edge (forward), returning to
   General from the inline-start edge (back). Same duration/easing tokens
   as the main window — no fade, no separate exit phase. */
#sessions-container.mode-in-forward{animation:mode-in-forward var(--motion-slide)}
#sessions-container.mode-in-back{animation:mode-in-back var(--motion-slide)}
@keyframes mode-in-forward{from{transform:translateX(100%)}}
@keyframes mode-in-back{from{transform:translateX(-100%)}}
@media (prefers-reduced-motion: reduce){
  #sessions-container.mode-in-forward,
  #sessions-container.mode-in-back{animation-duration:0.01ms}
}
#sessions-container::-webkit-scrollbar{width:4px}
#sessions-container::-webkit-scrollbar-track{background:transparent}
#sessions-container::-webkit-scrollbar-thumb{background:var(--tp-scrollbar);border-radius:2px}
/* ── Header row: title + segmented control ── */
.header{display:flex;align-items:center;justify-content:space-between;padding:8px 12px 4px;gap:8px}
.sub{font-size:11px;font-weight:600;color:var(--tp-sub-color);text-transform:uppercase;letter-spacing:.4px;display:flex;align-items:center;gap:6px;flex-shrink:0}
.sub svg.icon{width:12px;height:12px;opacity:.5;flex-shrink:0}
.ws-tree-session-item{position:relative;flex-shrink:0;display:flex;flex-direction:column;padding:9px 12px;border-radius:6px;cursor:pointer;margin-bottom:1px;color:var(--tp-name);font-size:13px;transition:background .1s}
.ws-tree-session-item:hover{background:var(--tp-hover)}
.ws-tree-session-item.active{background:var(--tp-active);color:var(--tp-color)}
.session-item-top{display:flex;align-items:center;justify-content:space-between;gap:6px}
.session-preview{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
/* Owning-workspace icon on iWork rows (same visuals as the main sidebar). */
.session-ws-icon{width:16px;height:16px;border-radius:4px;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;user-select:none;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
.session-ws-icon-img{width:100%;height:100%;object-fit:cover;display:block}
.session-ws-icon-letter{font-size:9px;font-weight:700;color:#fff;line-height:1}
.session-running,.session-waiting,.session-orange{display:inline-block;width:7px;height:7px;border-radius:50%;background:#22c55e;flex-shrink:0}
.session-waiting{background:#f59e0b}
.session-orange{background:#f97316}
.e{padding:18px;text-align:center;font-size:12px;color:var(--tp-empty);display:flex;align-items:center;justify-content:center;gap:6px}
.e svg.icon{width:14px;height:14px;opacity:.4}
.actions{display:flex;border-top:1px solid var(--tp-border)}
.actions>div{flex:1;display:flex;align-items:center;justify-content:center;padding:10px 4px;cursor:pointer;color:var(--tp-accent);transition:background .1s}
.actions>div:hover{background:var(--tp-hover);color:var(--tp-color)}
.actions>div:not(:last-child){border-right:1px solid var(--tp-border)}
.actions svg.icon{width:16px;height:16px;flex-shrink:0}
/* ── Tray tooltip (same pattern as main app's encre-tooltip) ── */
#tp-tip{position:fixed;z-index:999999;max-width:240px;padding:5px 9px;font-size:11.5px;line-height:1.4;border-radius:4px;pointer-events:none;white-space:pre-wrap;word-break:break-word;opacity:0;transition:opacity .12s ease;box-shadow:0 4px 14px rgba(0,0,0,.3)}
[data-theme="dark"] #tp-tip{background:#2a2a2a;color:#eee;border:1px solid #444}
[data-theme="light"] #tp-tip{background:#f5f5f5;color:#1f1f1f;border:1px solid #ddd}
#tp-tip.show{opacity:1}
</style>
<link rel="stylesheet" href="_components.css" />
</head>
<body>
<div class="header">
  <div class="sub" id="title-sub"></div>
  <div class="seg" id="mode-seg" role="tablist" aria-label="Mode switch">
    <button type="button" class="seg-item active" data-mode="normal" role="tab" aria-selected="true">
      <svg class="seg-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
      <span id="seg-chats">General</span>
    </button>
    <button type="button" class="seg-item" data-mode="iwork" role="tab" aria-selected="false">
      <svg class="seg-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="14" x="2" y="3" rx="2"/><line x1="8" x2="16" y1="21" y2="21"/><line x1="12" x2="12" y1="17" y2="21"/></svg>
      <span id="seg-workspaces">Work</span>
    </button>
  </div>
</div>
<div id="sessions-container"></div>
<div class="actions">
  <div id="btn-open" data-tp-title="Open Encre">
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17l9.2-9.2M17 17V7H7"/></svg>
  </div>
  <div id="btn-settings" title="Settings">
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
  </div>
  <div id="btn-quit" title="Quit">
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
  </div>
</div>
<div id="tp-tip"></div>
<script>
var LABELS = {
  en: {
    openYim: "Open Encre", sessions: "Sessions", chats: "General", workspaces: "Work",
    noSessions: "No active sessions", noWorkspaces: "No work sessions", quit: "Quit", messages: "msgs",
    settings: "Settings"
  },
  zh: {
    openYim: "打开 Encre", sessions: "会话", chats: "通用", workspaces: "工作",
    noSessions: "暂无活跃会话", noWorkspaces: "暂无工作区会话", quit: "退出", messages: "条消息",
    settings: "设置"
  }
};
var currentLabels = LABELS.en;
// Selected mode: "normal" or "iwork". Initialized from activeMode on first tray-data.
var currentMode = null;
var sessionsNormal = [];
var sessionsIwork = [];
// Workspace records (path/name/icon_data) for iWork row icons.
var trayWorkspaces = [];

function esc(s) {
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
function truncate(str, max) {
  return str.length > max ? str.slice(0, max - 1) + "…" : str;
}
function normPath(p) {
  return String(p || "").replace(/\\/g, "/").replace(/\/+$/, "").toLowerCase();
}
/* Deterministic hue from a name (mirrors the backend icon generator). */
function nameHue(name) {
  name = String(name || "");
  var h = 0;
  for (var i = 0; i < name.length; i++) { h = ((h * 31) + name.charCodeAt(i)) >>> 0; }
  return h % 360;
}
/* Icon for the workspace a session belongs to — ALWAYS shown on iWork rows
   (real icon from the workspace record, a path-derived letter avatar, or a
   neutral default when the path is missing). */
function wsIconHtml(wsPath, force) {
  if (!wsPath) {
    if (!force) return "";
    return '<span class="session-ws-icon" style="background:hsl(0,0%,42%)"><span class="session-ws-icon-letter">W</span></span>';
  }
  var w = null;
  for (var i = 0; i < trayWorkspaces.length; i++) {
    if (normPath(trayWorkspaces[i].path) === normPath(wsPath)) { w = trayWorkspaces[i]; break; }
  }
  if (w) {
    var letter = esc(String(w.name || "?")[0].toUpperCase());
    var inner = w.icon_data
      ? '<img class="session-ws-icon-img" src="' + w.icon_data + '" alt="" draggable="false">'
      : '<span class="session-ws-icon-letter">' + letter + '</span>';
    var bgAttr = w.icon_data ? "" : ' style="background:hsl(' + nameHue(w.name) + ',62%,46%)"';
    return '<span class="session-ws-icon"' + bgAttr + '>' + inner + '</span>';
  }
  var base = String(wsPath).split(/[\\/]/).filter(Boolean).pop() || wsPath;
  return '<span class="session-ws-icon" style="background:hsl(' + nameHue(base) + ',62%,46%)">' +
    '<span class="session-ws-icon-letter">' + esc(String(base[0] || "?").toUpperCase()) + '</span></span>';
}
function sessionWsPath(s) {
  var m = (s && s.metadata) || {};
  return m.workspace_path || m.workspace || "";
}

/* ── Inline SVG icons (Lucide-compatible paths) ── */
var ICONS = {
  inbox: '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 16 12 14 15 10 15 8 12 2 12"/><path d="M5.45 5.11L2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></svg>'
};

function renderSessions(sessions, emptyKey) {
  var container = document.getElementById("sessions-container");
  container.innerHTML = "";
  sessions = (sessions || []).filter(function(s) { return (s.message_count || 0) > 0; });

  if (sessions && sessions.length > 0) {
    for (var i = 0; i < sessions.length; i++) {
      var s = sessions[i];
      var name = esc(truncate(s.name || s.preview || (s.session_id || "").slice(0, 8) || "Untitled", 28));
      // Session rows carry the unified `state` field ("idle" | "running" |
      // "awaiting_approval"); the older awaiting_approval/is_running flags no
      // longer exist on the payload, so the breathing light never rendered.
      var runningBadge = (s.state && s.state !== "idle") ? '<span class="session-' + (s.state === "awaiting_approval" ? "waiting" : "running") + '"></span>' : "";
      // iWork rows carry their owning-workspace icon, like the main sidebar.
      var icon = currentMode === "iwork" ? wsIconHtml(sessionWsPath(s), true) : "";
      var row = document.createElement("div");
      row.className = "ws-tree-session-item";
      row.setAttribute("data-sid", s.session_id || "");
      row.innerHTML = '<div class="session-item-top">' + icon + '<span class="session-preview">' + name + '</span>' + runningBadge + '</div>';
      container.appendChild(row);
    }
  } else {
    var empty = document.createElement("div");
    empty.className = "e";
    empty.innerHTML = ICONS.inbox + '<span>' + currentLabels[emptyKey] + '</span>';
    container.appendChild(empty);
  }
}

function render() {
  var labels = currentLabels;
  document.getElementById("btn-open").setAttribute("data-tp-title", labels.openYim);
  document.getElementById("btn-settings").setAttribute("data-tp-title", labels.settings);
  document.getElementById("btn-quit").setAttribute("data-tp-title", labels.quit);
  document.getElementById("seg-chats").textContent = labels.chats;
  document.getElementById("seg-workspaces").textContent = labels.workspaces;
  document.getElementById("title-sub").innerHTML = '<span>' + labels.sessions + '</span>';

  if (currentMode === "iwork") {
    renderSessions(sessionsIwork, "noWorkspaces");
  } else {
    renderSessions(sessionsNormal, "noSessions");
  }
}

function setMode(mode) {
  if (mode !== "normal" && mode !== "iwork") return;
  var prevMode = currentMode;
  currentMode = mode;
  var segs = document.querySelectorAll("#mode-seg .seg-item");
  for (var i = 0; i < segs.length; i++) {
    var match = segs[i].getAttribute("data-mode") === mode;
    segs[i].classList.toggle("active", match);
    segs[i].setAttribute("aria-selected", match ? "true" : "false");
  }
  var container = document.getElementById("sessions-container");
  if (!container) { render(); return; }
  // Rebuild the list, then replay the unified full-width slide so the new
  // mode's rows travel in from the correct edge (forward = inline-end,
  // back = inline-start). One phase only — no separate exit animation.
  container.classList.remove("mode-in-forward", "mode-in-back");
  render();
  if (prevMode !== null && prevMode !== mode) {
    void container.offsetWidth; // restart even when the direction repeats
    container.classList.add(mode === "iwork" ? "mode-in-forward" : "mode-in-back");
  }
}

/* ── Theme application ── */
function applyTheme(theme) {
  if (theme === "dark" || theme === "light") {
    document.documentElement.setAttribute("data-theme", theme);
  }
}

/* ── Custom tooltip (same pattern as main app's encre-tooltip) ── */
(function(){
  var tip = document.getElementById("tp-tip");
  var currentEl = null, showTimer = null, SHOW_DELAY = 600;
  function show(el, text) {
    tip.textContent = text;
    var r = el.getBoundingClientRect();
    var left = r.left + r.width / 2 - tip.offsetWidth / 2;
    var top = r.bottom + 6;
    if (top + tip.offsetHeight > window.innerHeight - 4) top = r.top - tip.offsetHeight - 6;
    left = Math.max(4, Math.min(left, window.innerWidth - tip.offsetWidth - 4));
    tip.style.left = left + "px";
    tip.style.top = top + "px";
    tip.classList.add("show");
  }
  function hide() {
    clearTimeout(showTimer); showTimer = null;
    tip.classList.remove("show");
    currentEl = null;
  }
  document.addEventListener("mouseover", function(e) {
    var target = e.target;
    var el = target.closest ? target.closest("[title],[data-tp-title]") : null;
    if (!el || el.closest(".seg")) { if (currentEl) hide(); return; }
    // Read from data-tp-title (set by render), fallback to title, then strip native
    var text = el.getAttribute("data-tp-title") || el.getAttribute("title");
    if (!text) { if (currentEl) hide(); return; }
    el.removeAttribute("title");
    if (currentEl === el) return;
    clearTimeout(showTimer);
    if (currentEl) tip.classList.remove("show");
    currentEl = el;
    showTimer = setTimeout(function() {
      if (currentEl === el) show(el, text);
    }, SHOW_DELAY);
  }, true);
  document.addEventListener("mouseout", function(e) {
    if (!currentEl) return;
    var r = e.relatedTarget;
    if (r && (r === currentEl || currentEl.contains(r))) return;
    hide();
  }, true);
  document.addEventListener("scroll", hide, true);
  document.addEventListener("pointerdown", hide, true);
})();

document.getElementById("btn-open").addEventListener("click", function() {
  if (window.electronAPI && window.electronAPI.trayPopupAction) {
    window.electronAPI.trayPopupAction("open", null);
  }
});
document.getElementById("btn-settings").addEventListener("click", function() {
  if (window.electronAPI && window.electronAPI.trayPopupAction) {
    window.electronAPI.trayPopupAction("settings", null);
  }
});
document.getElementById("btn-quit").addEventListener("click", function() {
  if (window.electronAPI && window.electronAPI.trayPopupAction) {
    window.electronAPI.trayPopupAction("quit", null);
  }
});
/* ── Session click: open the selected session ── */
document.getElementById("sessions-container").addEventListener("click", function(e) {
  var row = e.target.closest ? e.target.closest(".ws-tree-session-item") : null;
  if (row) {
    var sid = row.getAttribute("data-sid");
    if (sid && window.electronAPI && window.electronAPI.trayPopupAction) {
      window.electronAPI.trayPopupAction("open", sid);
    }
    return;
  }
});
document.getElementById("mode-seg").addEventListener("click", function(e) {
  var seg = e.target.closest ? e.target.closest("[data-mode]") : null;
  if (seg) setMode(seg.getAttribute("data-mode"));
});
/* Drop the slide class once the entrance finishes so it never lingers. */
document.getElementById("sessions-container").addEventListener("animationend", function(e) {
  if (e.animationName === "mode-in-forward" || e.animationName === "mode-in-back") {
    e.currentTarget.classList.remove("mode-in-forward", "mode-in-back");
  }
});

if (window.electronAPI && window.electronAPI.onTrayData) {
  window.electronAPI.onTrayData(function(data) {
    currentLabels = LABELS[data.locale] || LABELS.en;
    if (data.theme) {
      applyTheme(data.theme);
    }
    if (data.sessionsNormal) sessionsNormal = data.sessionsNormal;
    if (data.sessionsIwork) sessionsIwork = data.sessionsIwork;
    if (data.workspaces) trayWorkspaces = data.workspaces;
    // Initialize the selected tab from the main window's active mode (first load).
    if (currentMode === null && data.activeMode) {
      setMode(data.activeMode === "iwork" ? "iwork" : "normal");
    } else {
      render();
    }
  });
}

render([]);
</script>
</body>
</html>
