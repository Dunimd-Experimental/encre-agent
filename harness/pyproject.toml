[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "encre-harness"
version = "0.5.0"
description = "Encre Harness — embeddable Python agent harness library"
requires-python = ">=3.14"
license = {text = "Apache-2.0"}
dependencies = [
    # --- HTTP / networking core ---
    "httpx>=0.27",
    "httpx-ws>=0.7",
    "websockets>=12.0,<14",
    "certifi>=2024.0",
    # --- Config / serialization ---
    "tomli>=2.0",
    "pyyaml>=6.0",
    # --- Crypto / security ---
    "cryptography>=41.0",
    # --- Web content extraction (web_fetch builtin + renderer) ---
    "beautifulsoup4>=4.12",
    "markdownify>=0.12",
    "lxml>=5.1",
    # --- PDF (file_read builtin) ---
    "pypdf>=4.0",
    "PyPDF2>=3.0",
    # --- Imaging / OCR (desktop + ocr) ---
    "Pillow>=10.0",
    "pytesseract>=0.3",
    # --- Windows OCR (winrt 3.x splits each namespace into its own
    #     package; all three projections are required by ocr.py).
    #     Windows Runtime builds (C++/MSVC) cannot compile on macOS/Linux,
    #     so every winrt projection is gated to win32 or pip tries to build
    #     them there and dies with "Unsupported compiler: unix". ---
    "winrt-runtime>=3.0; sys_platform == 'win32'",
    "winrt-Windows.Media.Ocr>=1.0; sys_platform == 'win32'",
    "winrt-Windows.Graphics.Imaging>=1.0; sys_platform == 'win32'",
    "winrt-Windows.Storage.Streams>=1.0; sys_platform == 'win32'",
    # --- Desktop automation (harness computer module) ---
    "mss>=9.0",
    "pyautogui>=0.9",
    "uiautomation>=2.0; sys_platform == 'win32'",  # UIA is a Windows-only API
    "pyperclip>=1.8",
    # --- System observability ---
    "psutil>=6.0",
    "watchfiles>=0.21",
    # --- Tokens / logging ---
    "tiktoken>=0.5",
    "loguru>=0.7",
    # --- Cloud (bedrock backend, lazy import) ---
    "boto3>=1.34",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["encre*"]

[tool.setuptools.package-data]
"encre" = ["*.txt", "py.typed"]
"encre.prompts" = ["**/*.prompt"]
"encre.skills.builtin" = ["**/*.md"]

[project.entry-points."encre.plugins"]
# Third-party plugins may register here (installed via pip).
# Bundled mandatory/system-default EA packages are NOT listed: they are
# auto-discovered by the encre.plugins.ea_scan directory scan of ea_tools/.

[project.entry-points."ea.plugins"]
# User-installed third-party EA plugins register here via their own wheels.
# The bundled EA packages under core/ea_tools/ (encre-core distribution) do
# not need entries — the registry scans that directory directly.

# [tool.setuptools-rust]
# module = "encre._native"
# (manual: _native.pyd is copied into harness/encre/ during setup)

[project.optional-dependencies]
anthropic = ["anthropic>=0.30"]
ollama = ["ollama>=0.1"]
native = ["encre-native==0.5.0"]
aiohttp = ["aiohttp>=3.9"]
local = ["torch>=2.0", "transformers>=4.36"]
aws = ["boto3>=1.34"]
tracing = ["opentelemetry-api>=1.25", "opentelemetry-sdk>=1.25", "opentelemetry-exporter-otlp-proto-grpc>=1.25"]
whisper = ["openai-whisper>=20231117"]
skills = ["playwright>=1.44", "coverage>=7.0"]
byted = ["ark-sdk>=1.0", "veadk>=1.0", "volcengine-sdk-ark>=1.0", "volcengine-sdk-core>=1.0", "volcengine-tos>=1.0"]

# --- Platform-specific desktop automation extras ---
# Each group only works on its target OS.
# Model users pick the one matching their platform:
#   pip install encre-harness[windows]    # Windows
#   pip install encre-harness[macos]      # macOS
windows = [
    # Core OCR winrt projections moved to the main dependency list so any
    # install path (not only the [windows] extra) gets them.  This extra
    # now carries the remaining Windows-only niceties.
    "winrt-Windows.Devices.Geolocation>=1.0; sys_platform == 'win32'",  # Native GPS location
    "winrt-Windows.Devices.Sensors>=1.0; sys_platform == 'win32'",      # Accelerometer/gyro/light sensors
    "pywin32>=306; sys_platform == 'win32'",   # GPU/sensor/display info via WMI
]
macos = [
    "pyobjc-framework-Cocoa>=10",         # Foundation/NSData for Vision OCR
    "pyobjc-framework-Vision>=10",        # macOS Vision.framework OCR
    "pyobjc-framework-ApplicationServices>=10",  # Accessibility AX API
    "pyobjc-framework-CoreLocation>=10",  # Device location
    "pyobjc-framework-CoreGraphics>=10",  # Display info
]
linux = [
    "dbus-python>=1.3",                  # D-Bus bindings for GeoClue2 location
    "PyGObject>=3.50",                   # GLib main loop for GeoClue2
]

# --- Database driver extras (optional) ---
database-sqlite = ["aiosqlite>=0.20"]
database-postgresql = ["asyncpg>=0.29"]
database-mysql = ["aiomysql>=0.2"]
database-mssql = ["pymssql>=2.2"]
database-oracle = ["oracledb>=2.0"]
database-duckdb = ["duckdb>=1.0"]
database-clickhouse = ["clickhouse-driver>=0.2"]
database-mongodb = ["motor>=3.0", "pymongo>=4.6"]
database-redis = ["redis>=5.0"]
database-all = [
    "encre-harness[database-sqlite,database-postgresql,database-mysql,database-mssql,database-oracle,database-duckdb,database-clickhouse,database-mongodb,database-redis]",
]

all = [
    "encre-harness[anthropic,ollama,native,aiohttp,local,aws,tracing,whisper,byted,skills,windows,macos,database-all]",
]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.5",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "pyinstaller>=6.0",
]

# ── Test configuration ──────────────────────────────────────────────────────
# Run from harness/: `python -m pytest -q`
# Run from the repository root: `python -m pytest harness/tests -q`
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra"
filterwarnings = [
    "error::DeprecationWarning:encre.*",
]

# ── Lint configuration ─────────────────────────────────────────────────────
# The historical tree is not yet ruff-clean; new packages (contracts, kernel,
# tools, evals, tests) must stay clean:
#   python -m ruff check encre/contracts encre/kernel tools evals tests
[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "RUF", "ARG"]

[tool.ruff.lint.per-file-ignores]
# Tool classes carry model-facing schema on the class body.
"evals/**" = ["E501"]
