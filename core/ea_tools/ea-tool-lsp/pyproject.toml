[build-system]
requires = [
    "setuptools>=68",
    "wheel",
]
build-backend = "setuptools.build_meta"

[project]
name = "ea-tool-lsp"
version = "0.5.0"
description = "EA (Encre Agent) — system-default lsp tool(s)."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Dunimd Team", email = "dunimd@outlook.com" },
]
keywords = [
    "ea",
    "agent",
    "tool",
    "system-default",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
]
dependencies = [
    "encre-harness>=0.5.0",
]

[project.license]
text = "Apache-2.0"

[project.entry-points."ea.plugins"]
lsp = "ea_tool_lsp.plugin:create_plugin"

[tool.ea]
icon = "code"
engines = { encre = ">=0.5" }
tier = "system-default"

[tool.setuptools.packages.find]
where = [
    ".",
]
include = [
    "ea_tool_lsp*",
]

[tool.setuptools.package-data]
ea_tool_lsp = [
    "skills/**/*.md",
]
