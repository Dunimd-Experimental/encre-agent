[build-system]
requires = [
    "setuptools>=68",
    "wheel",
]
build-backend = "setuptools.build_meta"

[project]
name = "ea-connector-dingtalk"
version = "0.5.0"
description = "EA (Encre Agent) — system-default DingTalk connector plugin."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Dunimd Team", email = "dunimd@outlook.com" },
]
keywords = [
    "ea",
    "agent",
    "connector",
    "dingtalk",
    "system-default",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
]
dependencies = [
    "encre-harness>=0.5.0",
    "encre-core>=0.5.0",
]

[project.license]
text = "Apache-2.0"

[project.entry-points."ea.plugins"]
dingtalk = "ea_connector_dingtalk.plugin:create_plugin"

[project.optional-dependencies]
all = [
    "dingtalk-stream>=0.20",
    "alibabacloud-dingtalk>=1.0",
    "alibabacloud-tea-openapi>=0.4",
    "alibabacloud-tea-util>=0.3",
    "httpx>=0.27",
]

[tool.ea]
icon = "message-circle"
engines = { encre = ">=0.5" }
tier = "system-default"

[tool.setuptools.packages.find]
where = [
    ".",
]
include = [
    "ea_connector_dingtalk*",
]
