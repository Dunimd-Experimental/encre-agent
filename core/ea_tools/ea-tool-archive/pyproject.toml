[build-system]
requires = [
    "setuptools>=68",
    "wheel",
]
build-backend = "setuptools.build_meta"

[project]
name = "ea-tool-archive"
version = "0.5.0"
description = "EA (Encre Agent) — system-default archive tool. Create, extract, list, and inspect zip/tar/gz/bz2/xz archives."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Dunimd Team", email = "dunimd@outlook.com" },
]
keywords = [
    "ea",
    "agent",
    "tool",
    "archive",
    "system-default",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "encre-harness>=0.5.0",
]

[project.license]
text = "Apache-2.0"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.5",
]

[project.entry-points."ea.plugins"]
archive = "ea_tool_archive.plugin:create_plugin"

[tool.ea]
icon = "archive"
engines = { encre = ">=0.5" }
tier = "system-default"

[tool.setuptools.packages.find]
where = [
    ".",
]
include = [
    "ea_tool_archive*",
]

[tool.setuptools.package-data]
ea_tool_archive = [
    "skills/**/*.md",
]
