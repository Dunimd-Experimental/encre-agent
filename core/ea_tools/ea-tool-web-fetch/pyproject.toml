[build-system]
requires = [
    "setuptools>=68",
    "wheel",
]
build-backend = "setuptools.build_meta"

[project]
name = "ea-tool-web-fetch"
version = "0.5.0"
description = "EA (Encre Agent) — system-default web_fetch tool."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Dunimd Team", email = "dunimd@outlook.com" },
]
keywords = [
    "ea",
    "agent",
    "tool",
    "system-default",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
]
dependencies = [
    "encre-harness>=0.5.0",
    "httpx>=0.27",
    "markdownify>=0.13",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
]

[project.license]
text = "Apache-2.0"

[project.entry-points."ea.plugins"]
web-fetch = "ea_tool_web_fetch.plugin:create_plugin"

[project.optional-dependencies]
all = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
]

[tool.ea]
icon = "cloud-download"
engines = { encre = ">=0.5" }
tier = "system-default"

[tool.setuptools.packages.find]
where = [
    ".",
]
include = [
    "ea_tool_web_fetch*",
]

[tool.setuptools.package-data]
ea_tool_web_fetch = [
    "skills/**/*.md",
]
