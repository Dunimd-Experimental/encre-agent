[build-system]
requires = [
    "setuptools>=68",
    "wheel",
]
build-backend = "setuptools.build_meta"

[project]
name = "ea-skill-douyin-interactive-content-publish"
version = "0.5.0"
description = "EA (Encre Agent) system-default skill: douyin-interactive-content-publish."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Dunimd Team", email = "dunimd@outlook.com" },
]
keywords = [
    "ea",
    "agent",
    "skill",
    "douyin-interactive-content-publish",
    "system-default",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "encre-harness>=0.5.0",
]

[project.license]
text = "Apache-2.0"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.5",
]

[project.entry-points."ea.plugins"]
douyin-interactive-content-publish = "ea_skill_douyin_interactive_content_publish.plugin:create_plugin"

[tool.ea]
icon = "assets/icon.svg"
engines = { encre = ">=0.5" }
tier = "system-default"

[tool.setuptools.packages.find]
where = [
    ".",
]
include = [
    "ea_skill_douyin_interactive_content_publish*",
]

[tool.setuptools.package-data]
ea_skill_douyin_interactive_content_publish = [
    "skills/**/*",
]
