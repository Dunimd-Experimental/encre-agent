[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ea-tool-database"
version = "0.4.3"
description = "EA (Encre Agent) — system-default database tool(s)."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "Dunimd Team", email = "dunimd@outlook.com"}]
keywords = ["ea", "agent", "tool", "system-default"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
]
dependencies = ["encre-harness>=0.4.3"]

[project.entry-points."ea.plugins"]
database = "ea_tool_database.plugin:create_plugin"

[project.optional-dependencies]
# Database drivers are optional at install time: the tool connects to
# whatever drivers are importable in the ambient environment.
sqlite = ["aiosqlite>=0.20"]
postgresql = ["asyncpg>=0.29"]
mysql = ["aiomysql>=0.2"]
mssql = ["pymssql>=2.2"]
oracle = ["oracledb>=2.0"]
duckdb = ["duckdb>=1.0"]
clickhouse = ["clickhouse-driver>=0.2"]
mongodb = ["motor>=3.0", "pymongo>=4.6"]
redis = ["redis>=5.0"]
all = [
    "ea-tool-database[sqlite,postgresql,mysql,mssql,oracle,duckdb,clickhouse,mongodb,redis]",
]

[tool.ea]
tier = "system-default"

[tool.setuptools.packages.find]
where = ["."]
include = ["ea_tool_database*"]

[tool.setuptools.package-data]
"ea_tool_database" = ["skills/**/*.md"]
