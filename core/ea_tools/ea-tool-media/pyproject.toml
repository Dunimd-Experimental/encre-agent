[build-system]
requires = [
    "setuptools>=68",
    "wheel",
]
build-backend = "setuptools.build_meta"

[project]
name = "ea-tool-media"
version = "0.5.0"
description = "EA (Encre Agent) — system-default media tool(s)."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Dunimd Team", email = "dunimd@outlook.com" },
]
keywords = [
    "ea",
    "agent",
    "tool",
    "system-default",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
]
dependencies = [
    "encre-harness>=0.5.0",
]

[project.license]
text = "Apache-2.0"

[project.entry-points."ea.plugins"]
media = "ea_tool_media.plugin:create_plugin"

[project.optional-dependencies]
whisper = [
    "openai-whisper>=20231117",
]
all = [
    "static-ffmpeg>=2.5",
]

[tool.ea]
danger_levels = {media = "high"}
icon = "film"
engines = { encre = ">=0.5" }
tier = "system-default"

[tool.setuptools.packages.find]
where = [
    ".",
]
include = [
    "ea_tool_media*",
]

[tool.setuptools.package-data]
ea_tool_media = [
    "skills/**/*.md",
]
