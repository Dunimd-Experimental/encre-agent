[build-system]
requires = [
    "setuptools>=68",
    "wheel",
]
build-backend = "setuptools.build_meta"

[project]
name = "ea-skill-canvas-design"
version = "0.5.0"
description = "EA (Encre Agent) system-default skill: canvas-design."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Dunimd Team", email = "dunimd@outlook.com" },
]
keywords = [
    "ea",
    "agent",
    "skill",
    "canvas-design",
    "system-default",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "encre-harness>=0.5.0",
]

[project.license]
text = "Apache-2.0"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.5",
]

[project.entry-points."ea.plugins"]
canvas-design = "ea_skill_canvas_design.plugin:create_plugin"

[tool.ea]
icon = "pen-tool"
engines = { encre = ">=0.5" }
tier = "system-default"

[tool.setuptools.packages.find]
where = [
    ".",
]
include = [
    "ea_skill_canvas_design*",
]

[tool.setuptools.package-data]
ea_skill_canvas_design = [
    "skills/**/*",
]
