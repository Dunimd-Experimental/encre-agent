[build-system]
requires = [
    "setuptools>=68",
    "wheel",
]
build-backend = "setuptools.build_meta"

[project]
name = "ea-tool-grep"
version = "0.5.0"
description = "EA (Encre Agent) — system-default grep tool(s)."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Dunimd Team", email = "dunimd@outlook.com" },
]
keywords = [
    "ea",
    "agent",
    "tool",
    "system-default",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
]
dependencies = [
    "encre-harness>=0.5.0",
]

[project.license]
text = "Apache-2.0"

[project.entry-points."ea.plugins"]
grep = "ea_tool_grep.plugin:create_plugin"

[tool.ea]
engines = { encre = ">=0.5" }
tier = "system-default"
icon = "text-search"
activation = "core"
danger_levels = { grep = "safe" }

[tool.setuptools.packages.find]
where = [
    ".",
]
include = [
    "ea_tool_grep*",
]

[tool.setuptools.package-data]
ea_tool_grep = [
    "skills/**/*.md",
]
