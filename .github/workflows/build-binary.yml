name: Build encre Binary

on:
  push:
    branches: [master]
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # One installer per platform -- every build bundles ALL locales
          # (build.py defaults to --locales all); no per-language variants.
          - os: ubuntu-latest
            target: linux-x64
            arch: x64
          - os: ubuntu-24.04-arm
            target: linux-arm64
            arch: arm64
          - os: windows-latest
            target: windows-x64
            arch: x64
          - os: macos-15-intel
            target: macos-x64
            arch: x64
          - os: macos-latest
            target: macos-arm64
            arch: arm64

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Encre Agent requires Python 3.14+ — core/harness declare
          # requires-python >= 3.14 and build.py hard-fails on older
          # interpreters before packaging (the same interpreter is later
          # bundled by PyInstaller).
          python-version: '3.14'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - name: Build
        run: python build.py
        env:
          TARGET_ARCH: ${{ matrix.arch }}
          # Vendor application secret, baked into the native extension at
          # compile time (option_env! in encre-py).  Configure it as a
          # repository Actions secret; it never appears in source or logs.
          ENCRE_EA_SECRET: ${{ secrets.ENCRE_EA_SECRET }}

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: encre-${{ matrix.target }}
          path: |
            *Setup*.exe
            *Setup*.pkg
            *Setup*.deb
            *Setup*.rpm

      - name: Upload Python library wheels
        uses: actions/upload-artifact@v4
        with:
          name: encre-wheels-${{ matrix.target }}
          path: dist/wheels/*.whl

      - name: Upload server binary
        uses: actions/upload-artifact@v4
        with:
          name: encre-server-${{ matrix.target }}
          path: build/server/encre-server/

      - name: Upload plugin CLI binary
        uses: actions/upload-artifact@v4
        with:
          name: encre-cli-${{ matrix.target }}
          path: build/cli/encre-plugin*
